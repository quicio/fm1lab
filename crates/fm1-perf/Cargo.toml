[package]
name = "fm1-perf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Panel de performance para el M-VAVE FM-1 (egui, sin webview)"

[dependencies]
fm1-core = { path = "../fm1-core" }
fm1-midi = { path = "../fm1-midi" }
# Pin de ADR-0002: 0.37 es una reescritura. Sin features de sistema que no usamos.
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.32"
# ADR-0006: sólo para escribir la captura de `--shot`.
png = "0.17"

[lints]
workspace = true
