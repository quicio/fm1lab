<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="FM1Lab">
  <!-- «Ceniza»: una sola señal lima sobre casi negro, sin gradientes ni sombras. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#07080A"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#2E343C" stroke-width="3"/>

  <!-- Tres faders verticales: el del medio es la señal. -->
  <g fill="#1B1F25">
    <rect x="348" y="282" width="28" height="460" rx="14"/>
    <rect x="498" y="282" width="28" height="460" rx="14"/>
    <rect x="648" y="282" width="28" height="460" rx="14"/>
  </g>

  <!-- Nivel del fader central. -->
  <rect x="505" y="432" width="14" height="280" rx="7" fill="#C8F751" opacity="0.5"/>

  <!-- Caps: dos en hueso, la del medio en lima. -->
  <g>
    <rect x="302" y="528" width="120" height="64" rx="16" fill="#E9EDF2"/>
    <rect x="452" y="368" width="120" height="64" rx="16" fill="#C8F751"/>
    <rect x="602" y="608" width="120" height="64" rx="16" fill="#E9EDF2"/>
  </g>

  <!-- Ranura de agarre. -->
  <g fill="#07080A">
    <rect x="340" y="557" width="44" height="6" rx="3"/>
    <rect x="490" y="397" width="44" height="6" rx="3"/>
    <rect x="640" y="637" width="44" height="6" rx="3"/>
  </g>
</svg>
