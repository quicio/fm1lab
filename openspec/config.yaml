schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  fm1lab: app de escritorio liviana en Rust para operar un M-VAVE FM-1 en vivo.
  Stack: workspace con fm1-core (dominio, sin I/O), fm1-midi (adaptador midir/CoreMIDI),
  fm1ctl (CLI). La UI es egui/eframe 0.32 sin webview (ADR-0002).
  Idioma: documentos en español; identificadores y nombres de API en inglés.
  Reglas duras: las dependencias apuntan hacia fm1-core; ninguna dependencia sin ADR;
  crates/fm1-core/src/nrpn_table.rs es generado (scripts/gen_nrpn.py) y no se edita a mano;
  la puerta es scripts/check.sh (fmt + clippy -D warnings + tests + mapa al día + humo de bytes).
  El aparato no manda ACK: la UI es optimista y reconcilia por el eco (MIDI OUT ALL).

