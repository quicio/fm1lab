[workspace]
members = [
    "crates/fm1-core",
    "crates/fm1-midi",
    "crates/fm1-store",
    "crates/fm1-flash",
    "crates/fm1ctl",
    "crates/fm1-perf",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"

# Iterar: optimizado como release, sin LTO ni debug info (mismo criterio que Candil: no llenar target/).
[profile.fast]
inherits = "dev"
opt-level = 2
debug = false
incremental = false

[profile.dev]
incremental = false
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
